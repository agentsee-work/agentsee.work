name: Check

# Every pull request and every push to main runs the engine's test suite and
# Ruff. Both are quick and both stay on the runner: the suite is stdlib-only
# against stubs (about fifteen seconds) and Ruff is one binary. A red tick
# here is a failure in the code, not a platform wobble.
#
# On main, a green tick deploys the engine (the deploy job below): the box
# fast-forwards to the commit and restarts, and the job is red if the engine
# did not come up on it (engine/home/README.md, "Deploying on green"). The
# site is deploy.yml and does not wait for this: public/ is not what these
# jobs look at (README).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch supersedes the run for the older one,
# except on main, where a run may be deploying: there the newer one queues.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  engine:
    name: Engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The same interpreter the engine runs on (engine/home/Dockerfile).
          python-version: "3.14"

      - name: The engine's one dependency
        # fpdf2 makes the release's signed copy (engine/release.py); the suite
        # renders one. The same pin as engine/home/Dockerfile.
        run: pip install fpdf2==2.8.9

      - name: Run the suite
        # Dev mode prints a leaked connection, socket or response body as a
        # ResourceWarning beside the dots, so a leak is seen before it is a
        # problem. It does not fail the run; a failing test does.
        run: python3 -X dev engine/test_engine.py

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          # Pinned, so a new release's new rule cannot turn main red on its own.
          # Bump it deliberately; `pip install ruff==<version>` locally to match.
          version: "0.17.3"
          args: check

      - name: Formatting
        run: ruff format --check

  deploy:
    name: Deploy the engine
    needs: [engine, ruff]
    # Main only, green only, never a pull request: the box runs what main is.
    # A fork has no key, so no job for it.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == 'agentsee-work/agentsee.work'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deploys queue. One is never cancelled under another, which would leave
    # the box half way; the box itself takes them one at a time too.
    concurrency:
      group: deploy-engine
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Ask the box to deploy this commit
        # One SSH connection as the deploy user, whose key can only run
        # engine/home/deploy-gate.sh (restrict,command=… in its
        # authorized_keys), which checks the three words and runs deploy.sh
        # as root. What the script prints is this step's log, and its exit
        # status is this job's: red means the engine did not come up and
        # was put back on the commit before.
        env:
          KEY: ${{ secrets.ENGINE_DEPLOY_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::ENGINE_DEPLOY_KEY is not in the repository's Actions secrets (engine/home/README.md, Deploying on green)."
            exit 1
          fi
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy
          chmod 0600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes \
              -o UserKnownHostsFile=engine/home/known_hosts -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 -o ServerAliveInterval=15 \
              deploy@mail.agentsee.work "$GITHUB_SHA $GITHUB_ACTOR $RUN_URL"
          echo "::notice::The engine is on ${GITHUB_SHA::7}."
