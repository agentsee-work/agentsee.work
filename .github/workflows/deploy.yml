name: Deploy

# Pushing to main publishes the site.
#
# This is a convenience, not the source of truth. Deploys can always be run
# straight from a working copy with `wrangler pages deploy .` — see the README.
# That path deliberately does not touch GitHub, so a forge outage can never
# stop us shipping. If this workflow is red and you need to publish, publish.

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push should win rather than queue behind an older one, but never
# cancel a deploy that is already talking to Cloudflare.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Publish to Cloudflare Pages
    runs-on: ubuntu-latest
    # Forks don't get secrets, so don't hand them a job that must fail.
    if: github.repository == 'agentsee-work/agentsee.work'
    steps:
      - uses: actions/checkout@v4

      - name: Check nothing secret is about to be published
        run: |
          # Match credential-SHAPED values only. The docs legitimately contain
          # `export CLOUDFLARE_API_TOKEN=...` as a placeholder, and a check that
          # cries wolf over its own documentation gets switched off within a week.
          if grep -rInE 'cfat_[A-Za-z0-9_-]{20,}|CLOUDFLARE_API_TOKEN=[A-Za-z0-9_-]{30,}' \
               --exclude-dir=.git --exclude-dir=.github . ; then
            echo "::error::Something credential-shaped is in the working tree."
            exit 1
          fi
          echo "No credentials found in the tree."

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=agentsee --branch=main

      - name: Confirm the site is actually serving
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://agentsee.work/?ci=${GITHUB_SHA::7}-$i")
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "::notice::https://agentsee.work is serving 200 after ${GITHUB_SHA::7}"
              exit 0
            fi
            sleep 12
          done
          echo "::error::agentsee.work did not return 200 after the deploy."
          exit 1

      # An expired token gives no warning — the next push simply goes red. This
      # turns that into a heads-up. It must never fail the build: a deploy that
      # worked should not be marked broken by a token that still works.
      - name: Warn if the Cloudflare token is near expiry
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/tokens/verify" \
            -H "Authorization: Bearer $CF_TOKEN" -o /tmp/tok.json || true
          python3 - <<'PY' || true
          import json, datetime, pathlib

          raw = pathlib.Path("/tmp/tok.json")
          if not raw.exists():
              print("::notice::Could not reach the token verify endpoint; skipping.")
              raise SystemExit(0)
          try:
              expires = (json.loads(raw.read_text()).get("result") or {}).get("expires_on")
          except Exception:
              print("::notice::Could not parse the token verify response; skipping.")
              raise SystemExit(0)
          if not expires:
              print("::notice::Token reports no expiry; nothing to warn about.")
              raise SystemExit(0)

          when = datetime.datetime.fromisoformat(expires.replace("Z", "+00:00"))
          days = (when - datetime.datetime.now(datetime.timezone.utc)).days
          if days <= 21:
              print(f"::warning::CLOUDFLARE_API_TOKEN expires in {days} days "
                    f"({when:%d %B %Y}). Deploys will start failing. Roll it and "
                    f"run: gh secret set CLOUDFLARE_API_TOKEN --repo "
                    f"agentsee-work/agentsee.work")
          else:
              print(f"Token healthy: {days} days left (expires {when:%d %B %Y}).")
          PY
