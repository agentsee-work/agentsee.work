# Stalwart on the box infra/ provisions.
#
# Image name verified 11 September 2026: stalwartlabs/stalwart is current.
# The old stalwartlabs/mail-server repository stops at v0.11, which predates the
# v0.16 config model this directory is written for — pulling it would give you a
# server that wants a config.toml.
#
# Pinned, not :latest. This holds the mail; an unattended major upgrade is not
# something to discover from a container that will not start.
#
# Ports map 1:1 to the firewall rules in infra/server.tf, and all of them are
# INBOUND. Host-level SMTP blocks are egress-only, so they do not affect these;
# outbound is a separate question and the relay uses 8465 because of it.
#
# There is no outbound port 25 anywhere in this design — nothing is ever sent
# direct-to-MX.

services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16.21
    container_name: stalwart
    restart: unless-stopped

    ports:
      - "25:25"     # SMTP inbound — the whole point
      - "80:80"     # ACME http-01 challenge only
      - "443:443"   # JMAP + WebAdmin
      - "465:465"   # Submission, implicit TLS — our own clients
      - "993:993"   # IMAPS — Apple Mail

      # Bootstrap and recovery UI, LOOPBACK ONLY. Stalwart opens 8080 when it
      # finds no configuration, and again as "http-recovery" if it ever cannot
      # start normally. Reach it with a tunnel:
      #
      #   ssh -L 8080:localhost:8080 debian@mail.agentsee.work
      #   then browse http://localhost:8080
      #
      # The 127.0.0.1 prefix is the whole point — without it Docker publishes to
      # 0.0.0.0 and, worse, writes its own iptables rules that bypass the host
      # firewall. Here the OpenStack security group would still drop it, but
      # relying on that would mean the container's exposure and the declared
      # firewall disagreeing.
      - "127.0.0.1:8080:8080"

    volumes:
      # Everything that matters: mail, accounts, config, DKIM private keys.
      # This is what restic backs up, and the only thing on the box that
      # cannot be rebuilt from this repo.
      - /var/lib/stalwart:/opt/stalwart

    environment:
      # Referenced by the relay route as an EnvironmentVariable authSecret, so
      # the committed plan never contains the credential. Supplied by the
      # systemd unit or an .env file that is NOT in git — see .gitignore.
      RELAY_SMTP_PASSWORD: "${RELAY_SMTP_PASSWORD:?set RELAY_SMTP_PASSWORD}"

    # ⚠ The image's default is `--config /etc/stalwart/config.json`, which is
    # inside the container and therefore lost on every recreate. Pointed at the
    # mounted volume instead, so configuration survives a rebuild and is
    # included in the backup.
    #
    # This was found the hard way: config.json was originally mounted at
    # /opt/stalwart/etc/config.json, a path nothing reads. Stalwart found no
    # config, entered bootstrap mode, and the setup wizard completed against
    # storage that did not persist — so a restart returned to a fresh wizard
    # with no error anywhere explaining why.
    command: ["--config", "/opt/stalwart/etc/config.json"]

    # The server writes crash context and needs a real hostname for HELO.
    hostname: mail.agentsee.work

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
