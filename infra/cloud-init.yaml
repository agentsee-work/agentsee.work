#cloud-config
# Base image only. Stalwart's own configuration is deliberately NOT here.
#
# The split: OpenTofu declares infrastructure with a real API behind it —
# servers, firewalls, DNS, IAM. Application config is versioned separately and
# deployed separately. Modelling a mail server's internals as Terraform
# resources produces a bad Terraform module and a worse mail server.
#
# This file is in `ignore_changes` on the server, because editing it should not
# silently mean "destroy the mailbox host". Change it, then rebuild on purpose.
#
# ⚠ The login is `debian`, not root. OpenStack images inject the keypair into
# the image's default user; the hardening below permits root by key but nothing
# puts a key there. Use `ssh debian@...` and sudo.
#
# There is deliberately no ufw. The firewall is the OpenStack security group in
# infra/server.tf, which is declared, reviewable in a plan, and applies before
# the box finishes booting. A second host firewall that is NOT declared is the
# drift this repo keeps warning about — and an unconfigured ufw protects
# nothing while looking like it does.
#
# ⚠ AFTER CHANGING THIS FILE, verify on a fresh box:
#     sudo cloud-init status --long        # must say `status: done`
# It is in ignore_changes, so editing it does not rebuild anything.

package_update: true
package_upgrade: true

# ⚠ ONE MISSING PACKAGE ABORTS THE WHOLE LIST, and cloud-init reports it only
# in `cloud-init status --long`. The box comes up, SSH works, write_files and
# runcmd all succeed — and nothing is installed. Found the hard way on
# 11 September 2026: `docker-compose-plugin` does not exist in Debian bookworm,
# so docker, restic, fail2ban and unattended-upgrades were all silently absent.
#
# Docker is NOT in this list. It comes from docker.com in runcmd — see below.
packages:
  - restic
  - fail2ban
  - unattended-upgrades
  - ca-certificates
  - curl

write_files:
  # Security updates apply themselves. An unpatched box holding all our mail is
  # a worse risk than an unattended reboot.
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin prohibit-password
      KbdInteractiveAuthentication no

  - path: /root/README
    content: |
      agentsee mail host — provisioned by infra/ (OpenTofu).

      This box is disposable. Config comes from the repo, mail comes from
      backups. If it is broken, rebuilding is a legitimate first response
      and is expected to work — if it does not, that is the bug.

      Do not hand-fix anything you have not also changed in the repo.
      A hand-fix at 2am is how the IaC starts lying, and IaC that lies is
      worse than none: it is confidently wrong.

      That rule is under the most pressure here, because this box is also
      where new things get tried, and trying things means hand-fixing.

      So: experiments live in /opt/lab, in containers, and nothing outside
      /opt/lab gets touched by hand. /opt/lab is NOT backed up and NOT
      rebuilt — if something there earns permanence, it earns a place in
      the repo first. The day you cannot rebuild this box from the repo
      plus a restore is the day the mail server became a pet.

runcmd:
  # ── Docker from docker.com, not from Debian ────────────────────────────────
  # Debian bookworm ships docker.io 20.10.24, which dates from 2022 and cannot
  # unpack the layer format modern images are pushed with. Pulling
  # stalwartlabs/stalwart:v0.16.21 on it fails with
  #
  #   failed to register layer: archive/tar: invalid tar header
  #
  # which reads like a corrupt download and is not one. Debian also ships only
  # compose v1 (1.29.2, end-of-life, `docker-compose` rather than
  # `docker compose`), so the official repository settles both problems at once.
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - bash -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  - systemctl enable --now docker
  - systemctl enable --now fail2ban
  - systemctl restart ssh

  # NOT the mail volume — that is formatted and mounted by hand in
  # MAIL-BUILD-RUNBOOK phase 2, because a first-boot script that can reformat
  # the disk holding the mail is a bad thing to get subtly wrong, and cloud-init
  # reruns on rebuild. The chown to uid 2000 belongs with that step too: the
  # Stalwart container does not run as root.
  # Experiments go here, and only here. Not backed up, deliberately.
  - install -d -m 0755 /opt/lab
  # NOT the mail volume. That is formatted and mounted by hand in phase 2 —
  # a first-boot script that can reformat the disk holding the mail is a bad
  # thing to get subtly wrong, and cloud-init reruns on rebuild.
